- type: entity
  parent: FloorWaterEntity
  id: FloorWaterEntityPool
  name: pool water
  description: You do NOT want to drink this.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    sprite: _DEN/Tiles/Planet/water.rsi
    drawdepth: BelowFloor
    layers:
    - state: pool_water
  - type: SyncSprite
  - type: Clickable
  - type: Solution
    id: pool
    solution:
      maxVol: 10000
      reagents:
      - ReagentId: Water
        Quantity: 9900
      - ReagentId: Chlorine
        Quantity: 100 # about 1/100 chlorine
  # chlorinated pool water is actually supposed to be 1-5 ppm of chlorine but solution
  # transfers and metabolism in ss14 round to the nearest 0.01 and the idea of poisoning
  # yourself by drinking pool water is fucking hysterical.
  # for the record, a full human stomach of this stuff is 2 toxin damage. its not much
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 99
      - ReagentId: Chlorine
        Quantity: 1
  - type: DrainableSolution
    solution: pool
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:Extinguish
  - type: Edible
    edible: Drink
    destroyOnEmpty: false
    utensil: None
    solution: pool
    transferAmount: 1
