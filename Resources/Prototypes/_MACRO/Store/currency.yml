# Salvage Reward Tickets start

- type: currency
  id: SalvageTicket
  cash:
    1: SalvageTicket
  displayName: salvage tickets
  canWithdraw: true

- type: entity
  name: salvage exchange ticket
  parent: BaseItem
  id: SalvageTicket
  suffix: 1
  description: Exchange your tickets for equipment!
  components:
  - type: Sprite
    sprite: _MACRO/Objects/Specific/Cargo/salvage_reward_ticket.rsi
    state: icon
  - type: Item
    sprite: _MACRO/Objects/Specific/Cargo/salvage_reward_ticket.rsi
    shape:
    - 0,0,1,1
  - type: Stack
    count: 1
    stackType: SalvageRewardTicket
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 0
  - type: Currency
    price:
      SalvageTicket: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      RewardTicket: 1

- type: entity
  parent: SalvageTicket
  id: SalvageTicket2
  suffix: 2
  components:
  - type: Stack
    count: 2

- type: entity
  parent: SalvageTicket
  id: SalvageTicket3
  suffix: 3
  components:
  - type: Stack
    count: 3

- type: entity
  parent: SalvageTicket
  id: SalvageTicket5
  suffix: 5
  components:
  - type: Stack
    count: 5

- type: entity
  parent: SalvageTicket
  id: SalvageTicket75
  suffix: 75
  components:
  - type: Stack
    count: 75

- type: entity
  parent: SalvageTicket
  id: SalvageTicket100
  suffix: 100
  components:
  - type: Stack
    count: 100

- type: material
  id: RewardTicket
  stackEntity: SalvageTicket
  name: salvage-reward-ticket
  unit: materials-unit-piece
  icon: { sprite: _MACRO/Objects/Specific/Cargo/salvage_reward_ticket.rsi, state: icon }
  price: 0.01

- type: stack
  id: SalvageRewardTicket
  icon: { sprite: _MACRO/Objects/Specific/Cargo/salvage_reward_ticket.rsi, state: icon }
  spawn: SalvageTicket

# Salvage Reward Tickets end
