#species weights used for non character creator randomly generater species.
- type: weightedRandomSpecies
  id: VisitorSpeciesWeights
  weights:
    Human: 1
    Reptilian: 1
    SlimePerson: 1
    Moth: 1
    Dwarf: 1
    Diona: 1
    Vox: 1
    Vulpkanin: 1
    # Uncomment species here that you want randomly generated for visitor species.
    #Allulalo: 1
    #Apid: 0.5
      # Traditionally, apids aren't seen wandering around super often, but you're free to let them.
    #Ant: 0.1
      # Set this to what you want, but ants are sort of designed to be a funny novelty - it's better if they're rare.
    #Decapoid: 1
      # Note that Decapoids rely on non-oxygen internals (water vapor), and - like Vox - will begin
      # suffocating if left idle for long enough (such as pending ghostroles.)
    #Gastropoid: 1
    #Gray: 1
    #Kodepiia: 1
    #Ovinia: 1
    #Ungu: 1
