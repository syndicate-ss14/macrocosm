- type: !PartialOnly entity
  id: FoodPieBase
  components: &unguFood
  - type: Tag
    tags:
    - UnguFood

- type: !PartialOnly entity
  id: FoodPieSliceBase
  components: *unguFood

# Note: All of the meat-based foods redefine their own tags, removing UnguFood.
# The UnguFood tag is intentionally not readded, as Ungu are vegetarian.
# If any other vegetarian (non-meat) foods get added, make sure they're tagged properly.
