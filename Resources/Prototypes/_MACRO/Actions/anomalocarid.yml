- type: entity
  parent: BaseAction
  id: ActionVentHeat
  components:
  - type: Action
    icon:
      sprite: _MACRO/Interface/Actions/anomalocarid.rsi
      state: vent
    useDelay: 30
  - type: InstantAction
    event: !type:HeatVentActionEvent

#TODO: Make the burst fire work and use thirst as ammo
- type: entity
  id: ActionAnomalocaridSpit
  name: "[color=teal]Spit Water[/color]"
  description: Spit a small stream of water!
  components:
  - type: Action
    icon:
      sprite: _MACRO/Interface/Actions/anomalocarid.rsi
      state: spit
    itemIconStyle: BigAction
    priority: 2
    sound: !type:SoundPathSpecifier
      path: /Audio/Weapons/Guns/Gunshots/water_spray.ogg
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: BulletWaterShot
