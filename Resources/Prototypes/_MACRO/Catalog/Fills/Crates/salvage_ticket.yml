    contents:
    - id: Defibrillator
    - id: MedibotFlatpack 
    - id: MedicalBedFlatpack  
    - id: MedkitCombat
    - id: Jug
    - id: BodyBagFolded
      amount: 2
    - id: ClothingEyesHudMedical
    - id: EmergencyMedipen
      amount: 2