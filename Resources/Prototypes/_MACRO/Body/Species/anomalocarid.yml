- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceAnomalocarid
  name: anomalocarid appearance
  components:
  - type: Inventory
    speciesId: anomalocarid
    templateId: anomalocarid
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Anomalocarid/displacement.rsi
            state: jumpsuit
      gloves:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Anomalocarid/displacement.rsi
            state: hand
      outerClothing:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Anomalocarid/displacement.rsi
            state: outerClothing
      shoes:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Anomalocarid/displacement.rsi
            state: shoes
      belt:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Anomalocarid/displacement.rsi
            state: belt
      back:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Anomalocarid/displacement.rsi
            state: back
  - type: InitialBody
    organs:
      Torso: TorsoAnomalocarid
      Head: HeadAnomalocarid
      ArmLeft: LeftArmAnomalocarid
      ArmRight: RightArmAnomalocarid
      HandRight: RightHandAnomalocarid
      HandLeft: LeftHandAnomalocarid
      LegLeft: LeftLegAnomalocarid
      LegRight: RightLegAnomalocarid
      FootLeft: LeftFootAnomalocarid
      FootRight: RightFootAnomalocarid
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Anomalocarid
    hideLayersOnEquip:
    - Eyes
    - HeadTop
    - HeadSide #might go back on this


- type: entity
  parent:
  - AppearanceAnomalocarid
  - BaseSpeciesMobOrganic
  id: MobAnomalocarid
  name: Urist McBlblbl
  components:
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.4 # a little less barotrauma
        Heat: 0.1
  - type: TemperatureDamage # anomalocarids are benthic hydrothermal vent dwellers, they love high pressure and high heat
    heatDamageThreshold: 4000
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold : 1 #per second, scales with temperature & other constants
    specificHeat: 42
    heatDamage:
      types:
        Heat : 1 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      293: 0.8
      280: 0.6
      260: 0.4
  - type: Damageable
    damageModifierSet: Anomalocarid
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _MACRO/Mobs/Effects/anomalocarid_brute_damage.rsi
        color: "#18d6a7"
      Burn:
        sprite: _MACRO/Mobs/Effects/anomalocarid_burn_damage.rsi
  - type: Flammable
    damage:
      types:
        Heat: 1.3 #takes just a little bit more to light them on fire
  - type: FireVisuals
    sprite: _MACRO/Mobs/Effects/anomalocarid_onfire.rsi #too big for normal onfire states, they need their own rsi
    normalState: Generic_mob_burning_anomalocarid #same as the regular sprite, just resized to fit anomalocarids
    alternateState: Standing_anomalocarid
  - type: Bloodstream
    bloodReagent: AnomalocaridCopperBlood #similar to CopperBlood, just a different color.
  - type: Butcherable
    butcheringType: Spike
    spawned:
      - id: FoodMeatCrab
        amount: 5
  - type: MeleeWeapon
    attackRate: 0.6 #slower swing because they hit harder
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 8
  - type: ActionGun
    action: ActionAnomalocaridSpit
    gunProto: AnomalocaridSpitGun
  - type: HeatVent
    tooHotPopups:
      - anomalocarid-vent-toohot1
      - anomalocarid-vent-toohot2
      - anomalocarid-vent-toohot3
  - type: AnomalocaridAccent

  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,1.3
  - type: TypingIndicator
    proto: anomalocarid
  - type: Speech
    speechBubbleOffset: 0.35
    speechVerb: Anomalocarid
    speechSounds: Anomalocarid
    allowedEmotes: ['Click', 'Chitter', 'Bubble', 'Pop']
    suffixSpeechVerbs:
      chat-speech-verb-suffix-exclamation-strong: AnomalocaridExclamationStrong
      chat-speech-verb-suffix-exclamation: AnomalocaridExclamation
      chat-speech-verb-suffix-stutter: AnomalocaridStutter
  - type: Vocal
    sounds:
      Male: UnisexAnomalocarid
      Female: UnisexAnomalocarid
      Unsexed: UnisexAnomalocarid
  - type: Tag
    tags:
    - AnomalocaridClaw #this exists so they can dig through rocks
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
    - AnomalyHost

  - type: Sprite
    noRot: true
    drawdepth: Mobs
    layers:
      - map: [ "enum.HumanoidVisualLayers.TailBehind" ] # Floof
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
      - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
      - map: [ "jumpsuit" ]
      - map: [ "enum.HumanoidVisualLayers.LHand" ]
      - map: [ "enum.HumanoidVisualLayers.RHand" ]
      - map: [ "enum.HumanoidVisualLayers.LFoot" ]
      - map: [ "enum.HumanoidVisualLayers.RFoot" ]
      - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
        color: "#ffffff"
        sprite: Objects/Misc/handcuffs.rsi
        state: body-overlay-2
        visible: false
      - map: [ "gloves" ]
      - map: [ "shoes" ]
      - map: [ "eyes" ]
      - map: [ "belt" ]
      - map: [ "id" ]
      - map: [ "outerClothing" ]
      - map: [ "enum.HumanoidVisualLayers.TailBehindBackpack" ] # imp
      - map: [ "back" ]
      - map: [ "enum.HumanoidVisualLayers.TailOversuit" ] # Floof
      - map: [ "enum.HumanoidVisualLayers.Tail" ] #layered above the back, maybe has very very minor balance implications (hiding guns behind your wings) but i think it's fine.
      - map: [ "ears" ] #above tail for over-ear headsets specifically. this means they layer over backpacks and outerclothing too, unsure about that right now.
      - map: [ "neck" ]
      - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      - map: [ "enum.HumanoidVisualLayers.Hair" ]
      - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      - map: [ "mask" ]
      - map: [ "head" ]
      - map: [ "pocket1" ]
      - map: [ "pocket2" ]
      - map: [ "clownedon" ]
        sprite: "Effects/creampie.rsi"
        state: "creampie_anomalocarid"
        visible: false
        offset: 0, 0.375 #gotta offset the pie
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300 #big
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
#      fix2: #fixture for head, dunno how to do this right yet
